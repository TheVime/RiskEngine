version: "3.9"

services:
  riskengine:
    image: riskengine:github
    build:
      context: https://github.com/TheVime/RiskEngine.git#main
      dockerfile: Dockerfile
    container_name: riskengine
    ports:
      - "8501:8501"
    volumes:
      - riskengine_data:/data
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    restart: unless-stopped

volumes:
  riskengine_data:
    driver: local
