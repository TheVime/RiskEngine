# Tema scuro di RiskEngine.
#
# Documentazione ufficiale delle opzioni disponibili:
# https://docs.streamlit.io/develop/concepts/configuration/theming-customize-colors-and-borders
#
# Nota: chartCategoricalColors qui sotto deve restare sincronizzato a mano
# con CHART_PALETTE in app.py, usata dai grafici che passano theme=None a
# st.altair_chart (quei grafici non ereditano questo tema automaticamente).

[theme]
base = "dark"
primaryColor = "#5B8DEF"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#161A23"
textColor = "#E6E6E6"
borderColor = "#2A2E37"
baseRadius = "large"

chartCategoricalColors = [
    "#5B8DEF", "#00C2A8", "#F2A93B", "#F25F5C",
    "#9B5DE5", "#4C6EF5", "#2ED9C3", "#FFD166",
]
chartSequentialColors = [
    "#0E1117", "#1B2333", "#243352", "#2E4779",
    "#3A5FA6", "#5B8DEF", "#8FB3F5", "#C3D7FA",
]
